apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-workbench-frontend
  labels:
    app.kubernetes.io/name: stt-workbench-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stt-workbench-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stt-workbench-frontend
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      nodeSelector:
        workload: general
      serviceAccountName: stt-workbench
      containers:
        - name: frontend
          image: stt-workbench-frontend:stag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: gcs-samples
              mountPath: /srv/vod
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: gcs-samples
          csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: true
            volumeAttributes:
              bucketName: media17-stream-stt-prod
              mountOptions: "implicit-dirs,only-dir=samples"
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
