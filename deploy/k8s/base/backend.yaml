apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-workbench-backend
  labels:
    app.kubernetes.io/name: stt-workbench-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stt-workbench-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stt-workbench-backend
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      nodeSelector:
        workload: general
      serviceAccountName: stt-workbench
      containers:
        - name: backend
          image: stt-workbench-backend:stag
          imagePullPolicy: IfNotPresent
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: SAMPLES_ROOT
              value: /gcs_mount/samples
            - name: GOLDEN_ROOT
              value: /gcs_mount/golden_samples
            - name: VOD_URL_PREFIX
              value: /vod
            - name: FFPROBE_PATH
              value: /usr/bin/ffprobe
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: gcs-samples
              mountPath: /gcs_mount/samples
              readOnly: true
            - name: gcs-golden
              mountPath: /gcs_mount/golden_samples
              readOnly: false
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: gcs-samples
          csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: true
            volumeAttributes:
              bucketName: media17-stream-stt-prod
              mountOptions: "implicit-dirs,only-dir=samples"
        - name: gcs-golden
          csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: false
            volumeAttributes:
              bucketName: media17-stream-stt-prod
              mountOptions: "implicit-dirs,only-dir=golden_samples"
